version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretaria
      POSTGRES_PASSWORD: secretaria
      POSTGRES_DB: secretaria_educacion
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/001_init_pgvector.sql:/docker-entrypoint-initdb.d/001_init_pgvector.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://secretaria:secretaria@db:5432/secretaria_educacion
      VECTOR_BACKEND: pgvector
      UPLOAD_DIR: /data/uploads
      VECTOR_INDEX_PATH: /data/faiss_index
    volumes:
      - documents_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  documents_data:
